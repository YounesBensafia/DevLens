[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devlens-tool"
version = "0.3.0"
description = "A cli tool to help developers understand and manage their codebases."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.1.1",
    "radon>=6.0.1",
    "requests>=2.32.5",
    "rich>=14.1.0",
    "typer>=0.17.4",
]
authors = [{ name = "Younes BENSAFIA", email = "bensafia.younes.usthb@gmail.com" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/YounesBensafia/DevLens"
Repository = "https://github.com/YounesBensafia/DevLens"
Issues = "https://github.com/YounesBensafia/DevLens/issues"


[tool.uv]
package = true

[project.optional-dependencies]
dev = [
    "build>=1.4.2",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "setuptools>=82.0.1",
    "twine>=6.2.0",
    "wheel>=0.46.3",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

[tool.coverage.run]
source = ["devlens"]
omit = [
    "devlens/render/*",
    "devlens/console/*",
    "devlens/prompt/*",
    "devlens/cli/*",
    "devlens/utils/check_*",
    "devlens/utils/has_file*",
    "devlens/utils/count_folders*",
    "devlens/utils/get_size*",
    "devlens/utils/count_lines*",
    "devlens/analyzer/ai_summary*",
    "devlens/analyzer/stats*",
]

[tool.coverage.report]
fail_under = 60

[tool.devlens]
# Per-project scoring weights (optional)
# Uncomment to override defaults (50/30/20):
# weights = { metrics = 0.60, git = 0.25, llm = 0.15 }

[project.scripts]
devlens = "devlens.cli.cli:main"
